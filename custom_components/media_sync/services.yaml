  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: media_sync

confirm_deletions:
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: media_sync

get_pending_deletions:
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: media_sync
