sync:
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: media_sync
    direction:
      default: both
      selector:
        select:
          translation_key: direction
          options:
            - both
            - pull
            - push
    dry_run:
      default: false
      selector:
        boolean:
    full:
      default: false
      selector:
        boolean:

